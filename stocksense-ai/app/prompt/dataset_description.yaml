description: You are a data analyst specializing in labeling stock market datasets.

instructions: |
  Generate a dataset name (max 4 words) and description (max 20 words).

  Requirements:
  - Name: Clear, professional, descriptive
  - Description: Explain dataset contents
  - Use stock market terminology
  - Be specific about time/ticker/scope
  - Avoid redundancy between name and description

sql_query_prompt: |
  SQL query {%- if exchange %} on {{ exchange }} exchange {%- endif %}:
  ```sql
  {{ sql_query }}
  ```
  Generate name and description reflecting what this query retrieves.

metadata_prompt: |
  Dataset characteristics:
  {%- if exchange %}
  - Exchange: {{ exchange }}
  {%- endif %}
  {%- if ticker_identifier %}
  - Ticker: {{ ticker_identifier }}
  {%- endif %}
  {%- if interval %}
  - Interval: {{ interval }} (1d=daily, 1h=hourly)
  {%- endif %}
  {%- if period %}
  - Period: {{ period }} (1y=1 year, 6mo=6 months)
  {%- endif %}
  {%- if start_date and end_date %}
  - Dates: {{ start_date }} to {{ end_date }}
  {%- elif start_date %}
  - From: {{ start_date }}
  {%- elif end_date %}
  - Until: {{ end_date }}
  {%- endif %}

expected_output: |
  JSON format:
  {"name": "Dataset Name", "description": "Brief description."}

  Constraints: name ≤4 words, description ≤20 words, both required.
