[project]
name = "StockSense-Stockdb"
version = "1.3.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alive-progress>=3.3.0",
    "fastapi>=0.135.1",
    "orjson>=3.11.3",
    "polars[deltalake,pyarrow]>=1.33.0",
    "pydantic-settings>=2.10.1",
    "pyyaml>=6.0.3",
    "rich>=14.3.1",
    "scalar-fastapi>=1.6.1",
    "scipy>=1.16.2",
    "stocksense-core[data,ai]",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "jupyterlab>=4.5.6",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = ""

[tool.uv.sources]
stocksense-core = { git = "https://github.com/Akashdesarda/stock-research-platform.git", subdirectory = "core" }

[tool.ty.rules]
unresolved-attribute = "ignore"
unresolved-attributes = "ignore"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
