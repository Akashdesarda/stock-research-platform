name: Stock-Research-Assistant
services:
    # 1. Snapshot Data Initialization Service
    init_snapshot:
        image: ghcr.io/akashdesarda/stock-research-platform/snapshot-data:latest
        volumes:
            - ./config.toml:/tmp/config.toml
            - shared-data:/shared
        environment:
            FORCE_DECOMPRESSION: "false" # Force decompression only if required
        command: ["uv", "run", "/snapshot_data_decompress.py"]
        tty: true
    # 2. Stock Database API Service
    stockdb-api:
        build:
            context: ./stockdb
            dockerfile: Dockerfile
        image: ghcr.io/akashdesarda/stock-research-platform/stockdb-api:latest
        pull_policy: always
        ports:
            - "8080:8080"
        volumes:
            - shared-data:/shared
        environment:
            CONFIG_FILE: /shared/assets/config.toml
            DOCKER_CONTAINER: "true" # Explicit Docker environment flag
            COMMON__PHOENIX_URL: "http://phoenix"
        depends_on:
            init_snapshot:
                condition: service_completed_successfully
        tty: true
    # 3. Stocksense AI
    stocksense-ai:
        image: ghcr.io/akashdesarda/stock-research-platform/stocksense-ai:latest
        pull_policy: always
        ports:
            - "9000:9000"
        volumes:
            - shared-data:/shared
        environment:
            CONFIG_FILE: /shared/assets/config.toml
            DOCKER_CONTAINER: "true" # Explicit Docker environment flag
            COMMON__SQLITE_PATH: "/shared/sqlite/agno.db"
            COMMON__POSTGRES_URL: "postgres"
            STOCKDB__STOCKDB_URL: "http://stockdb-api"
        tty: true
    # 4. PostgreSQL database shared by application services
    postgres:
        image: postgres:17
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: stockdb
            POSTGRES_USER: stocksense
            POSTGRES_PASSWORD: "0330"
            POSTGRES_MULTIPLE_DATABASES: agno
            PGDATA: /shared/postgres/data
        volumes:
            - shared-data:/shared
            - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
        tty: true

volumes:
    shared-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ~/.local/share/stock-research-platform
