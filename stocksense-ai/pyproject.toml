[project]
name = "stocksense-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "stocksense-core",
    "agno[os]>=2.6.5",
    "httpx>=0.28.1",
    "groq>=1.2.0",
    "psycopg[binary]>=3.3.4",
    "yfinance>=1.3.0",
    "openai>=2.38.0",
    "scalar-fastapi>=1.8.2",
    "sqlglot>=30.7.0",
    "openrouter>=0.9.1",
    "anthropic>=0.105.2",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "httpx2>=2.4.0",
    "google-genai>=2.9.0",
]

[dependency-groups]
dev = ["ipykernel>=7.2.0", "pytest>=9.0.3"]

[tool.uv.sources]
stocksense-core = { git = "https://github.com/Akashdesarda/stock-research-platform.git", subdirectory = "core" }

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
