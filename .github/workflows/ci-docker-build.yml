name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - "stockdb/**"
      - "snapshot/**"
      - "stocksense-ai/**"
      # Optional: run when this workflow file changes
      - ".github/workflows/ci-docker-build.yml"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build and push even if no relevant files changed"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      REPO: akashdesarda/stock-research-platform
      IMAGE_TAG_TS: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect directory changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            stockdb:
              - 'stockdb/**'
            snapshot:
              - 'snapshot/**'
            stocksense-ai:              
              - 'stocksense-ai/**'

      # Only log in when we are going to push (skip on PRs)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        run: |
          echo "IMAGE_TAG_TS=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and (conditionally) push srp-stockdb-api
        if: steps.changes.outputs.stockdb == 'true' || github.event.inputs.force_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./stockdb/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/srp-stockdb-api:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/srp-stockdb-api:${{ env.IMAGE_TAG_TS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and (conditionally) push srp-snapshot-data
        if: steps.changes.outputs.snapshot == 'true' || github.event.inputs.force_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./snapshot/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/srp-snapshot-data:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/srp-snapshot-data:${{ env.IMAGE_TAG_TS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and (conditionally) push stocksense-ai
        if: steps.changes.outputs.stocksense-ai == 'true' || github.event.inputs.force_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./stocksense-ai/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/stocksense-ai:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/stocksense-ai:${{ env.IMAGE_TAG_TS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
