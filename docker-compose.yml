name: Stock-Research-Assistant
services:
    # 1. Snapshot Data Initialization Service
    init_snapshot:
        image: ghcr.io/akashdesarda/stock-research-platform/srp-snapshot-data:latest
        volumes:
            - ./config.toml:/tmp/config.toml
            - shared-data:/shared
        environment:
            FORCE_DECOMPRESSION: "false" # Force decompression only if required
        command: ["uv", "run", "/snapshot_data_decompress.py"]
        tty: true
    # 2. Stock Database API Service
    stockdb-api:
        build:
            context: ./stockdb
            dockerfile: Dockerfile
        image: ghcr.io/akashdesarda/stock-research-platform/srp-stockdb-api:latest
        pull_policy: always
        ports:
            - "8080:8080"
        volumes:
            - shared-data:/shared
        environment:
            CONFIG_FILE: /shared/assets/config.toml
            DOCKER_CONTAINER: "true" # Explicit Docker environment flag
            COMMON__PHOENIX_URL: "http://phoenix"
        depends_on:
            init_snapshot:
                condition: service_completed_successfully
        tty: true
    # 3. Arize phoenix server
    phoenix:
        image: arizephoenix/phoenix:latest
        ports:
            - 6006:6006 # PHOENIX_PORT
            - 4317:4317 # PHOENIX_GRPC_PORT
        environment:
            PHOENIX_PORT: 6006
            PHOENIX_WORKING_DIR: /shared/phoenix
        volumes:
            - shared-data:/shared
        tty: true
    # 4. PostgreSQL database shared by application services
    postgres:
        image: postgres:17
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: stockdb
            POSTGRES_USER: stocksense
            POSTGRES_PASSWORD: "0330"
            POSTGRES_MULTIPLE_DATABASES: agno
            PGDATA: /shared/postgres/data
        volumes:
            - shared-data:/shared
            - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
        tty: true

volumes:
    shared-data:
        name: "sra-shared-data"
