[project]
name = "stocksense-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.6.22",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "reflex>=0.8.23",
    "reflex-enterprise>=0.4.2",
    "stocksense-core[ai]",
]

[tool.uv.sources]
stocksense-core = { git = "https://github.com/Akashdesarda/stock-research-platform.git", subdirectory = "core" }

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.pyrefly.errors]
bad-assignment = false
invalid-argument = false
bad-class-definition = false

[dependency-groups]
dev = ["ipykernel>=7.1.0"]
